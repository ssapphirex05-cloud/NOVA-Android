plugins {
    id 'com.android.application'
}

// google-services.json is intentionally optional at source level so CI can still
// build the APK before Firebase is configured. Once the file is placed in app/,
// the Google Services plugin is applied automatically and FCM becomes active.
def firebaseConfigPresent = file('google-services.json').exists()
if (firebaseConfigPresent) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.nova.messenger'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nova.messenger'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1.0'

        buildConfigField 'String', 'NOVA_URL', '"https://246830.9yy8ob5y94yx.mjtest.ru/nova_messenger_v1/"'
        buildConfigField 'boolean', 'FIREBASE_CONFIGURED', firebaseConfigPresent ? 'true' : 'false'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            // Keep the production applicationId so one Firebase Android app
            // (com.nova.messenger) works for both GitHub debug builds and release builds.
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
}
