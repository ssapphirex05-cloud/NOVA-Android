plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def firebaseConfigPresent = file('google-services.json').exists()
if (firebaseConfigPresent) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.nova.messenger.native2'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nova.messenger'
        minSdk 26
        targetSdk 35
        versionCode 20003
        versionName '2.0.0-alpha3'
        buildConfigField 'String', 'NOVA_URL', '"https://246830.9yy8ob5y94yx.mjtest.ru/nova_messenger_v1/"'
        buildConfigField 'boolean', 'FIREBASE_CONFIGURED', firebaseConfigPresent ? 'true' : 'false'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
