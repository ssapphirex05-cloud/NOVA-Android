name: Build NOVA Android Native

on:
  workflow_dispatch:
  push:
    branches: [ native-2.0 ]

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Firebase config status
        run: |
          if [ -f nativeapp/google-services.json ]; then
            echo "Firebase config detected."
          else
            echo "Firebase config missing. APK still builds without FCM registration."
          fi
      - name: Build Native APK
        run: gradle :nativeapp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-Android-Native-2.0.0-alpha3
          path: nativeapp/build/outputs/apk/debug/nativeapp-debug.apk
